{{ define "main" }}
  <article class="pa3 pa4-ns nested-copy-line-height">
    <section class="cf ph3 ph5-l pv3 pv4-l f4 tc-l center measure-wide lh-copy {{ $.Param "text_color" | default "mid-gray" }}">
      {{ .Content }}
    </section>

    <div class="flex-l">
      <!-- Posts section -->
      <section class="flex-auto flex-wrap justify-around mt5 ph3 ph5-l">
        {{ $pages := .Pages.ByDate.Reverse }}
        {{ range $pages }}
          <div class="relative w-100 w-45-l mb4 bg-white">
            {{ .Render "summary" }}
          </div>
        {{ end }}
      </section>

      <!-- Tags filter section on the right -->
      <aside class="w-25-l pl4-l mt5">
        <div class="sticky">
          <h3 class="f4 mb3">Filter by tag:</h3>
          {{ $tags := .Site.Taxonomies.tags }}
          {{ if $tags }}
            <div class="mb3">
              <a href="{{ .RelPermalink }}" class="link f6 grow no-underline br-pill ba ph3 pv2 mb2 dib black sans-serif {{ if eq .Page.Params.filterTag ""}}bg-black white{{ end }}">
                All Posts
              </a>
            </div>
            {{ range $tags.ByCount }}
              <div class="mb2">
                <a href="{{ .Page.RelPermalink }}" class="link f6 grow no-underline br-pill ba ph3 pv2 dib black sans-serif">
                  {{- .Name -}}
                </a>
              </div>
            {{ end }}
          {{ end }}
        </div>
      </aside>
    </div>
  </article>
{{ end }}
